name: Coverage

# This is deliberately *not* part of `branch-protection.yml`:
#
# * it needs the `push` trigger to give Coveralls a datapoint for every commit, which a
#   `workflow_call`-only workflow cannot do; and
# * coverage is a metric rather than a correctness property, so a coveralls.io outage should not be
#   able to block merging.

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures",
  # and we get coverage reports on Coveralls for every push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Even though this workflow isn't part of branch protection, it still reads its Python version and
  # runner image from the shared configuration so they don't have to be kept in step by hand.
  config:
    name: Configure
    if: github.repository_owner == 'Qiskit'
    uses: ./.github/workflows/config.yml

  coverage:
    name: Coverage
    needs: config
    runs-on: ${{ needs.config.outputs.runner-linux-x86_64 }}
    timeout-minutes: 30
    env:
      # Override the `rust-toolchain.toml` file because `grcov` has greater requirements than our MSRV.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ needs.config.outputs.python-coverage }}

      - name: Install Rust
        run:
          rustup toolchain install stable
            --override
            --profile minimal
            --component llvm-tools-preview
            --no-self-update

      - name: Install dependencies
        run: |
            python -m pip install -U pip
            cargo install grcov@0.8.20
            sudo apt-get install lcov

      - name: Compile Qiskit C API
        shell: bash
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          git clone https://github.com/Qiskit/qiskit build/qiskit
          cd build/qiskit
          # checkout the latest (i.e. stable) release tag
          git checkout $(gh release -R Qiskit/qiskit view --json tagName --jq ".tagName")
          make c

      - name: Rust coverage
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make rustcoverage

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make cext

      - name: C coverage
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make ccoverage

      - name: Install Python package
        shell: bash
        run: |
          pip install --group build --group coverage qiskit
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"

      - name: Python coverage
        shell: bash
        run: |
          make pycoverage

      - name: Combine coverage
        shell: bash
        run: |
          make coveragecombine

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coveralls.info
