name: Coverage

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures",
  # and we get coverage reports on Coveralls for every push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    if: github.repository_owner == 'Qiskit'
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install dependencies
        run: |
            python -m pip install -U pip
            cargo install grcov@0.8.20
            sudo apt-get install lcov

      - name: Compile Qiskit C API
        shell: bash
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          git clone https://github.com/Qiskit/qiskit build/qiskit
          cd build/qiskit
          # checkout the latest (i.e. stable) release tag
          git checkout $(gh release -R Qiskit/qiskit view --json tagName --jq ".tagName")
          make c qiskit-pyo3-ffi

      - name: Rust coverage
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make rustcoverage

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make cext

      - name: C coverage
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make ccoverage

      - name: Install Python package
        shell: bash
        run: |
          pip install --pre qiskit
          pip install --group build --group coverage
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install --no-build-isolation -e ".[all]"

      - name: Python coverage
        shell: bash
        run: |
          make pycoverage

      - name: Combine coverage
        shell: bash
        run: |
          make coveragecombine

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coveralls.info
