name: Coverage

# This is deliberately *not* part of `branch-protection.yml`:
#
# * it needs the `push` trigger to give Coveralls a datapoint for every commit, which a
#   `workflow_call`-only workflow cannot do; and
# * coverage is a metric rather than a correctness property, so a coveralls.io outage should not be
#   able to block merging.

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures",
  # and we get coverage reports on Coveralls for every push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Even though this workflow isn't part of branch protection, it still reads its Python version and
  # runner image from the shared configuration so they don't have to be kept in step by hand.
  config:
    name: Configure
    if: github.repository_owner == 'Qiskit'
    uses: ./.github/workflows/config.yml

  coverage:
    name: Coverage
    needs: config
    runs-on: ${{ needs.config.outputs.runner-linux-x86_64 }}
    timeout-minutes: 30
    env:
      # Override the `rust-toolchain.toml` file because `grcov` has greater requirements than our MSRV.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ needs.config.outputs.python-coverage }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s PEP 735 dependency groups
          # and extras), so the pip wheel cache is keyed on that file.  Coarser than a lockfile: any
          # edit to it, dependency-related or not, invalidates the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      # `Cargo.lock` is committed and pins every dependency to crates.io, so it fully describes what
      # gets downloaded.  Deliberately the registry only, not `target/`: two build scripts key off the
      # Qiskit C API whose path is constant in CI while its contents move, and the workspace is built
      # under several mutually exclusive feature and profile combinations that would not share
      # artifacts anyway.  `restore-keys` is safe here (unlike for the Qiskit C API cache) because the
      # registry is content-addressed -- a partial restore is just a warm subset that cargo completes
      # and checksums.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }} | ${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }}

      - name: Install Rust
        run:
          rustup toolchain install stable
            --override
            --profile minimal
            --component llvm-tools-preview
            --no-self-update

      # `grcov` is pinned to an exact version, so the compiled binary is reusable until that pin moves.
      # This is `~/.cargo/bin` only; the registry cache below deliberately excludes it so the two do not
      # overlap.
      - name: Cache grcov
        id: cache-grcov
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/grcov
          key: grcov | ${{ runner.os }} | ${{ runner.arch }} | 0.8.20

      - name: Install dependencies
        run: |
            python -m pip install -U pip
            if [[ "${{ steps.cache-grcov.outputs.cache-hit }}" != "true" ]]; then
              cargo install grcov@0.8.20
            fi
            sudo apt-get install lcov

      # Exports `QISKIT_LIB`/`QISKIT_INCLUDE` for the steps below.
      - name: Compile Qiskit C API
        uses: ./.github/actions/build-qiskit-capi
        with:
          ref-mode: latest-release
          python-version: ${{ needs.config.outputs.python-coverage }}

      - name: Rust coverage
        shell: bash
        run: |
          make rustcoverage

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          make cext

      - name: C coverage
        shell: bash
        run: |
          make ccoverage

      - name: Install Python package
        shell: bash
        run: |
          pip install --group build --group coverage qiskit
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"

      - name: Python coverage
        shell: bash
        run: |
          make pycoverage

      - name: Combine coverage
        shell: bash
        run: |
          make coveragecombine

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coveralls.info
