---
name: Lint

# This is a reusable workflow, driven by `branch-protection.yml`.  It deliberately has no `push` or
# `pull_request` triggers of its own, and no `concurrency` block: the calling workflow owns both.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.  Expects an Ubuntu image (we install `clang-format` via apt).
        type: string
        required: true
      python-version:
        description: Python version to use.
        type: string
        required: true

jobs:
  lint:
    name: Lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s PEP 735 dependency groups
          # and extras), so the pip wheel cache is keyed on that file.  Coarser than a lockfile: any
          # edit to it, dependency-related or not, invalidates the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      # No explicit toolchain: `rust-toolchain.toml` pins the version (our declared MSRV) and lists
      # the `rustfmt` and `clippy` components that `make lint` needs.
      # `Cargo.lock` is committed and pins every dependency to crates.io, so it fully describes what
      # gets downloaded.  Deliberately the registry only, not `target/`: two build scripts key off the
      # Qiskit C API whose path is constant in CI while its contents move, and the workspace is built
      # under several mutually exclusive feature and profile combinations that would not share
      # artifacts anyway.  `restore-keys` is safe here (unlike for the Qiskit C API cache) because the
      # registry is content-addressed -- a partial restore is just a warm subset that cargo completes
      # and checksums.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }} | ${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install dependencies
        run: |
            python -m pip install -U pip tox
            sudo apt-get install -y clang-format

      - name: Install Package
        shell: bash
        run: |
          pip install --group build --group lint qiskit
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"

      - name: Run lint check
        shell: bash
        run: |
          make lint
