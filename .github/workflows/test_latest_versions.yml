name: Latest version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures",
  # and we get coverage reports on Coveralls for every push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: github.repository_owner == 'Qiskit'
    name: latest version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        run: rustup toolchain install stable --override --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install -U pip

      - name: Compile Qiskit C API
        shell: bash
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          git clone https://github.com/Qiskit/qiskit build/qiskit
          cd build/qiskit
          # checkout the latest (i.e. stable) release tag
          git checkout $(gh release -R Qiskit/qiskit view --json tagName --jq ".tagName")
          make c
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # NOTE: we manually need to copy the `.dll.lib` file for now
            cp target/release/qiskit_cext.dll.lib dist/c/lib/qiskit.dll.lib
            # NOTE: for lack of a better solution, we also need to copy the
            # `_cext` files
            cp target/release/qiskit_cext.dll dist/c/lib/qiskit_cext.dll
            cp target/release/qiskit_cext.dll.lib dist/c/lib/qiskit_cext.dll.lib
          fi

      - name: Rust tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
            export PATH=$PATH:$(dirname $QISKIT_LIB)
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make testrust

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make cext

      - name: C tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make testc

      - name: Install Python package
        shell: bash
        run: |
          pip install --group build --group test qiskit
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e .

      - name: Python tests
        shell: bash
        run: |
          make pystubs testpython

      - name: Optional tests
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"
          make testoptional

      - name: Documentation tests
        shell: bash
        run: |
          make doctest
