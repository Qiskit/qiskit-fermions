---
name: Latest version tests

# This is a reusable workflow, driven by `branch-protection.yml` (for pull requests and the merge
# queue) and by `on-nightly.yml` (for the scheduled run).  It deliberately has no triggers of its own
# beyond `workflow_call`, and no `concurrency` block: the calling workflow owns both.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        type: string
        required: true
      python-version:
        description: Python version to test.
        type: string
        required: true

jobs:
  tests:
    # The caller's job name carries the matrix values, which GitHub appends to it, so this only needs
    # to say which suite is running.
    name: latest
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install -U pip

      - name: Compile Qiskit C API
        shell: bash
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          git clone https://github.com/Qiskit/qiskit build/qiskit
          cd build/qiskit
          # checkout the latest (i.e. stable) release tag
          git checkout $(gh release -R Qiskit/qiskit view --json tagName --jq ".tagName")
          make c
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # NOTE: we manually need to copy the `.dll.lib` file for now
            cp target/release/qiskit_cext.dll.lib dist/c/lib/qiskit.dll.lib
            # NOTE: for lack of a better solution, we also need to copy the
            # `_cext` files
            cp target/release/qiskit_cext.dll dist/c/lib/qiskit_cext.dll
            cp target/release/qiskit_cext.dll.lib dist/c/lib/qiskit_cext.dll.lib
          fi

      - name: Rust tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
            export PATH=$PATH:$(dirname $QISKIT_LIB)
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make testrust

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make cext

      - name: C tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make testc

      - name: Install Python package
        shell: bash
        run: |
          pip install --group build --group test qiskit
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e .

      - name: Python tests
        shell: bash
        run: |
          make pystubs testpython

      - name: Optional tests
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"
          make testoptional

      - name: Documentation tests
        shell: bash
        run: |
          make doctest
