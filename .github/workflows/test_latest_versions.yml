---
name: Latest version tests

# This is a reusable workflow, driven by `branch-protection.yml` (for pull requests and the merge
# queue) and by `on-nightly.yml` (for the scheduled run).  It deliberately has no triggers of its own
# beyond `workflow_call`, and no `concurrency` block: the calling workflow owns both.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        type: string
        required: true
      python-version:
        description: Python version to test.
        type: string
        required: true

jobs:
  tests:
    # The caller's job name carries the matrix values, which GitHub appends to it, so this only needs
    # to say which suite is running.
    name: latest
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s PEP 735 dependency groups
          # and extras), so the pip wheel cache is keyed on that file.  Coarser than a lockfile: any
          # edit to it, dependency-related or not, invalidates the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      # `Cargo.lock` is committed and pins every dependency to crates.io, so it fully describes what
      # gets downloaded.  Deliberately the registry only, not `target/`: two build scripts key off the
      # Qiskit C API whose path is constant in CI while its contents move, and the workspace is built
      # under several mutually exclusive feature and profile combinations that would not share
      # artifacts anyway.  `restore-keys` is safe here (unlike for the Qiskit C API cache) because the
      # registry is content-addressed -- a partial restore is just a warm subset that cargo completes
      # and checksums.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }} | ${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install -U pip

      # Exports `QISKIT_LIB`/`QISKIT_INCLUDE` for the steps below.
      - name: Compile Qiskit C API
        uses: ./.github/actions/build-qiskit-capi
        with:
          ref-mode: latest-release
          python-version: ${{ inputs.python-version }}

      - name: Rust tests
        shell: bash
        run: |
          make testrust

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          make cext

      - name: C tests
        shell: bash
        run: |
          make testc

      - name: Install Python package
        shell: bash
        run: |
          pip install --group build --group test qiskit
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e .

      - name: Python tests
        shell: bash
        run: |
          make pystubs testpython

      - name: Optional tests
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"
          make testoptional

      - name: Documentation tests
        shell: bash
        run: |
          make doctest
