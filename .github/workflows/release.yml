name: Deploy release artifacts
on:
  push:
    tags:
      - '*'
jobs:
  build:
    name: Build wheels
    uses: ./.github/workflows/wheels-build.yml
    with:
      artifact-prefix: "deploy-"
      default-action: "build"

  github:
    name: Publish to GitHub
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deploy-*
          path: deploy
          merge-multiple: true
      - name: Publish release
        uses: ghalactic/github-release-from-tag@v6
        with:
          prerelease: false
          generateReleaseNotes: "true"
          assets: |
            - path: deploy/*

  pypi:
    name: Publish to pypi
    runs-on: ubuntu-latest
    needs:
      - build
      - github
    environment:
      name: pypi
      url: https://pypi.org/p/qiskit-fermions
    permissions:
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deploy-*
          path: deploy
          merge-multiple: true
      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: deploy
