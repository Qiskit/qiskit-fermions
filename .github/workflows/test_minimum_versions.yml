---
name: Minimum version tests

# This is a reusable workflow, driven by `branch-protection.yml` (for pull requests and the merge
# queue) and by `on-nightly.yml` (for the scheduled run).  It deliberately has no triggers of its own
# beyond `workflow_call`, and no `concurrency` block: the calling workflow owns both.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test.
        type: string
        required: true
      runner:
        description: Runner image to use.
        type: string
        required: true
      qiskit-version:
        description: >
          Git ref of the oldest supported Qiskit release, used to build the Qiskit C API against.
        type: string
        required: true

jobs:
  tests:
    name: ${{ inputs.python-version }} / ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv

      - name: Compile Qiskit C API (minimum version)
        shell: bash
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          # Passed through the environment rather than interpolated directly into the script below.
          QISKIT_VERSION: ${{ inputs.qiskit-version }}
        run: |
          git clone https://github.com/Qiskit/qiskit build/qiskit
          cd build/qiskit
          # checkout the minimum release tag
          git checkout "$QISKIT_VERSION"
          make c

      - name: Rust tests
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make testrust

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make cext

      - name: C tests
        shell: bash
        run: |
          export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make testc

      - name: Install Python dependencies (minimum versions)
        run: |
          pip install --group build --group test qiskit
          uv sync --active --resolution lowest-direct

      - name: Install Python package
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e .

      - name: Python tests
        shell: bash
        run: |
          make pystubs testpython

      - name: Optional tests
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"
          make testoptional

      - name: Documentation tests
        shell: bash
        run: |
          make doctest
