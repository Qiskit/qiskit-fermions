---
name: Minimum version tests

# This is a reusable workflow, driven by `branch-protection.yml` (for pull requests and the merge
# queue) and by `on-nightly.yml` (for the scheduled run).  It deliberately has no triggers of its own
# beyond `workflow_call`, and no `concurrency` block: the calling workflow owns both.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        type: string
        required: true
      python-version:
        description: Python version to test.
        type: string
        required: true
      qiskit-version:
        description: >
          Git ref of the oldest supported Qiskit release, used to build the Qiskit C API against.
        type: string
        required: true

jobs:
  tests:
    # The caller's job name carries the matrix values, which GitHub appends to it, so this only needs
    # to say which suite is running.
    name: minimum
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv

      # Exports `QISKIT_LIB`/`QISKIT_INCLUDE` for the steps below.
      - name: Compile Qiskit C API (minimum version)
        uses: ./.github/actions/build-qiskit-capi
        with:
          ref-mode: pinned
          ref: ${{ inputs.qiskit-version }}
          python-version: ${{ inputs.python-version }}

      - name: Rust tests
        shell: bash
        run: |
          make testrust

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          make cext

      - name: C tests
        shell: bash
        run: |
          make testc

      - name: Install Python dependencies (minimum versions)
        run: |
          pip install --group build --group test qiskit
          uv sync --active --resolution lowest-direct

      - name: Install Python package
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e .

      - name: Python tests
        shell: bash
        run: |
          make pystubs testpython

      - name: Optional tests
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"
          make testoptional

      - name: Documentation tests
        shell: bash
        run: |
          make doctest
