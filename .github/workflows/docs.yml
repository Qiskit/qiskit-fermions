---
name: Sphinx

# This is a reusable workflow and the single source of truth for building the documentation.  It
# deliberately has no `push` or `pull_request` triggers of its own, and no `concurrency` block: the
# calling workflow owns both.
#
# It is called from two places:
#
# * `branch-protection.yml`, which only builds (`deploy: false`, the default); and
# * `docs_deploy.yml`, which builds and then publishes to GitHub Pages (`deploy: true`).
#
# The deployment lives here, behind an input, rather than in `docs_deploy.yml`, so that the build
# steps exist exactly once.  Publishing can't simply be a separate workflow that reuses the build,
# because an `actions/upload-pages-artifact` artifact cannot be handed between workflow runs.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.  Expects an Ubuntu image.
        type: string
        required: true
      python-version:
        description: Python version to use.
        type: string
        required: true
      deploy:
        description: >
          Whether to publish the built documentation to GitHub Pages.  Only ever set this for runs on
          `main`: a Pages deployment from anywhere else would clobber the published documentation.
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Docs
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s PEP 735 dependency groups
          # and extras), so the pip wheel cache is keyed on that file.  Coarser than a lockfile: any
          # edit to it, dependency-related or not, invalidates the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      # `Cargo.lock` is committed and pins every dependency to crates.io, so it fully describes what
      # gets downloaded.  Deliberately the registry only, not `target/`: two build scripts key off the
      # Qiskit C API whose path is constant in CI while its contents move, and the workspace is built
      # under several mutually exclusive feature and profile combinations that would not share
      # artifacts anyway.  `restore-keys` is safe here (unlike for the Qiskit C API cache) because the
      # registry is content-addressed -- a partial restore is just a warm subset that cargo completes
      # and checksums.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }} | ${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # Doxygen is a pinned binary release fetched from GitHub, so this saves the download and removes a
      # network dependency from the docs build.  Only the tarball is cached: `make install` scatters the
      # installed files across `/usr/local`, and re-running it is fast.
      - name: Cache Doxygen
        uses: actions/cache@v6
        with:
          path: doxygen-*.linux.bin.tar.gz
          key: doxygen | ${{ runner.os }} | ${{ hashFiles('tools/install_ubuntu_docs_dependencies.sh') }}

      - name: Install dependencies
        run: tools/install_ubuntu_docs_dependencies.sh
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Tell reno to name the upcoming release after the branch we are on
        shell: bash
        run: |
          sed -i.bak -e '/unreleased_version_title:*/d' releasenotes/config.yaml
          echo unreleased_version_title: \"Upcoming release \(\`\`${GITHUB_REF_NAME}\`\`\)\" >> releasenotes/config.yaml

      - name: Install Package
        shell: bash
        run: |
          pip install --group build --group docs qiskit
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"

      - name: Build docs
        shell: bash
        run: |
          make docs

      - name: Upload docs artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

      # Provide a nicely named artifact that extracts into an
      # identically named subdirectory.
      - name: Prepare nice docs artifact for humans
        if: always()
        shell: bash
        run: |
          mkdir artifact
          cp -a docs/_build/html artifact/qiskit-fermions-htmldocs

      - name: Upload nice docs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qiskit-fermions-htmldocs
          path: ./artifact

  deploy:
    name: deploy docs
    if: ${{ inputs.deploy }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
