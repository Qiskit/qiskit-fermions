---

# Nightly runs of the full test matrices.
#
# The test workflows themselves are `workflow_call`-only (they're driven by `branch-protection.yml` for
# pull requests and the merge queue), and a `workflow_call`-only workflow cannot carry a `schedule`
# trigger, so the schedule has to live in a caller like this one.
#
# This is also the main post-merge safety net: `branch-protection.yml` only runs on pull requests and
# the merge queue, so nothing else runs the full suites against `main`.  If this workflow starts
# failing, that needs to be noticed.

name: Nightly tests

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # The owner guard lives here alone: every other job `needs: config`, so skipping this one skips the
  # whole graph and forks don't burn their Actions minutes on our schedule.
  config:
    name: Configure
    if: github.repository_owner == 'Qiskit'
    uses: ./.github/workflows/config.yml

  # The development suite accepts an older cached Qiskit build rather than rebuilding whenever upstream
  # has moved on, which is right for pull requests but wrong for the nightly: this is the run whose
  # whole job is catching upstream breakage, so it must test the actual tip.
  #
  # Resolving the tip *here* and passing the commit down means the suite legs test a Qiskit that is at
  # most this job's own duration old, and -- because they are handed an exact commit rather than
  # resolving `main` themselves -- that they cannot drift apart from each other or miss the cache this
  # job just populated.
  qiskit-development-ref:
    name: Resolve Qiskit main
    needs: config
    runs-on: ${{ needs.config.outputs.runner-linux-x86_64 }}
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve the tip of Qiskit's main
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          ref=$(git ls-remote https://github.com/Qiskit/qiskit HEAD | cut -f1)
          if [[ -z "$ref" ]]; then
            echo "::error::failed to resolve the tip of Qiskit's main" >&2
            exit 1
          fi
          echo "Qiskit main is at $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  test-latest:
    name: Tests / Latest
    needs: config
    uses: ./.github/workflows/test_latest_versions.yml
    with:
      runner: ${{ matrix.config.runner }}
      python-version: ${{ matrix.config.python-version }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - runner: ${{ needs.config.outputs.runner-linux-x86_64 }}
            python-version: ${{ needs.config.outputs.python-old }}
          - runner: ${{ needs.config.outputs.runner-linux-x86_64 }}
            python-version: ${{ needs.config.outputs.python-new }}
          - runner: ${{ needs.config.outputs.runner-macos-arm64 }}
            python-version: ${{ needs.config.outputs.python-new }}
          - runner: ${{ needs.config.outputs.runner-windows-x86_64 }}
            python-version: ${{ needs.config.outputs.python-new }}

  test-minimum:
    name: Tests / Minimum
    needs: config
    uses: ./.github/workflows/test_minimum_versions.yml
    with:
      runner: ${{ matrix.config.runner }}
      python-version: ${{ matrix.config.python-version }}
      qiskit-version: ${{ needs.config.outputs.qiskit-minimum }}
    strategy:
      fail-fast: false
      # A single-entry matrix, for consistency with the other test jobs: GitHub appends the matrix
      # values to the job name, which is what makes the legs distinguishable in the Actions summary.
      matrix:
        config:
          - runner: ${{ needs.config.outputs.runner-linux-x86_64 }}
            python-version: ${{ needs.config.outputs.python-old }}

  test-development:
    name: Tests / Development
    needs:
      - config
      - qiskit-development-ref
    uses: ./.github/workflows/test_development_versions.yml
    with:
      runner: ${{ matrix.config.runner }}
      python-version: ${{ matrix.config.python-version }}
      # Passing the commit explicitly is what pins every leg to the same tip and keeps the nightly off
      # the stale-cache path that pull requests use.
      qiskit-ref: ${{ needs.qiskit-development-ref.outputs.ref }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - runner: ${{ needs.config.outputs.runner-linux-x86_64 }}
            python-version: ${{ needs.config.outputs.python-old }}
          - runner: ${{ needs.config.outputs.runner-linux-x86_64 }}
            python-version: ${{ needs.config.outputs.python-new }}
