name: Development version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures",
  # and we get coverage reports on Coveralls for every push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    if: github.repository_owner == 'Qiskit'
    name: Development version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        os: [macos-latest]
        python-version: ["3.13"]
        # include:
        #   - os: macos-latest
        #     python-version: "3.13"
        #   - os: windows-latest
        #     python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install dependencies
        run: |
            python -m pip install -U pip

      # - name: Compile Qiskit C API
      #   shell: bash
      #   run: |
      #     git clone https://github.com/Qiskit/qiskit build/qiskit
      #     cd build/qiskit
      #     make c
      #
      # - name: Rust tests
      #   shell: bash
      #   run: |
      #     export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
      #     export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
      #     make testrust
      #
      # - name: C tests
      #   shell: bash
      #   run: |
      #     export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
      #     export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
      #     make testc

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install --pre qiskit
          export QISKIT_LIB=$(python -c "import qiskit; print(qiskit.capi.get_lib())")
          export QISKIT_INCLUDE=$(python -c "import qiskit; print(qiskit.capi.get_include())")
          echo $QISKIT_LIB
          ls -la $(dirname $QISKIT_LIB)
          pip install --group build --group coverage
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e .

      - name: Python tests
        shell: bash
        run: |
          make testpython

      - name: Documentation tests
        shell: bash
        run: |
          make doctest
