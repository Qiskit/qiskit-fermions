name: Development version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures",
  # and we get coverage reports on Coveralls for every push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    if: github.repository_owner == 'Qiskit'
    name: Development version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      max-parallel: 4
      matrix:
        os: [windows-latest]
        python-version: ["3.13"] #["3.10", "3.13"]
        # include:
        #   - os: macos-latest
        #     python-version: "3.13"
        #   - os: windows-latest
        #     python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install dependencies
        run: |
            python -m pip install -U pip

      - name: Compile Qiskit C API
        shell: bash
        run: |
          git clone https://github.com/Qiskit/qiskit build/qiskit
          cd build/qiskit
          make c
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # NOTE: we manually need to copy the `.dll.lib` file for now
            cp target/release/qiskit_cext.dll.lib dist/c/lib/qiskit.dll.lib
            # NOTE: for lack of a better solution, we also need to copy thr
            # `_cext` files
            cp target/release/qiskit_cext.dll dist/c/lib/qiskit_cext.dll
            cp target/release/qiskit_cext.dll.lib dist/c/lib/qiskit_cext.dll.lib
          fi

      - name: Rust tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
            export PATH=$PATH:$(dirname $QISKIT_LIB)
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make testrust

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make cext

      - name: C tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "qiskit_cext.dll.lib")
          else
            export QISKIT_LIB=$(find $(pwd)/build/qiskit/dist/c/lib -name "libqiskit.*")
          fi
          export QISKIT_INCLUDE=$(pwd)/build/qiskit/dist/c/include
          make testc

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install --pre qiskit
          pip install --group build --group coverage
          export QISKIT_LIB=$(python -c "import qiskit; print(qiskit.capi.get_lib())")
          export QISKIT_INCLUDE=$(python -c "import qiskit; print(qiskit.capi.get_include())")
          export BINDGEN_EXTRA_CLANG_ARGS="-I$(python -c "import sysconfig; print(sysconfig.get_path('include'))")"
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e .

      - name: Python tests
        shell: bash
        run: |
          make testpython

      - name: Documentation tests
        shell: bash
        run: |
          make doctest
