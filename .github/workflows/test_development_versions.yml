---
name: Development version tests

# This is a reusable workflow, driven by `branch-protection.yml` (for pull requests and the merge
# queue) and by `on-nightly.yml` (for the scheduled run).  It deliberately has no triggers of its own
# beyond `workflow_call`, and no `concurrency` block: the calling workflow owns both.
#
# This builds Qiskit from `main`, so it can be broken by upstream changes with no local cause.  It is
# still part of branch protection (as it was before this was centralised); admins can bypass the
# ruleset on the rare days when upstream is broken.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        type: string
        required: true
      python-version:
        description: Python version to test.
        type: string
        required: true
      qiskit-ref:
        description: >
          Exact Qiskit commit to build against.  When empty (the pull-request case) the tip of
          Qiskit's `main` is resolved at run time and an older cached build is accepted rather than
          rebuilding, since upstream moves continuously.  The nightly run resolves the tip once in a
          preceding job and passes it here, so that it always tests that exact commit.
        type: string
        required: false
        default: ''

jobs:
  tests:
    # The caller's job name carries the matrix values, which GitHub appends to it, so this only needs
    # to say which suite is running.
    name: development
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install -U pip build uv

      # Also builds the Qiskit wheel installed further down, and exports
      # `QISKIT_LIB`/`QISKIT_INCLUDE` for the steps below.
      - name: Compile Qiskit from source
        uses: ./.github/actions/build-qiskit-capi
        with:
          ref-mode: ${{ inputs.qiskit-ref == '' && 'main' || 'pinned' }}
          ref: ${{ inputs.qiskit-ref }}
          python-version: ${{ inputs.python-version }}
          build-wheel: true
          # Only when resolving the tip ourselves.  Given an explicit commit (the nightly), that exact
          # commit is the point of the run and a near-miss would defeat it.
          allow-stale: ${{ inputs.qiskit-ref == '' }}

      - name: Rust tests
        shell: bash
        run: |
          make testrust

      - name: Compile qiskit-fermions C API
        shell: bash
        run: |
          make cext

      - name: C tests
        shell: bash
        run: |
          make testc

      - name: Install Python package
        shell: bash
        run: |
          # `build`/`test` pin `qiskit` to a single minor (see `pyproject.toml`, tied to the
          # vendored `qiskit-pyo3-ffi` snapshot), which conflicts with the dev wheel built here.
          # Excluding `qiskit` from `uv`'s resolution means that pin is never checked against the
          # already-installed dev version.
          pip install "qiskit @ file:$(echo build/qiskit/dist/*.whl)"
          uv pip install --system --exclude <(echo qiskit) --group build --group test
          SETUPTOOLS_RUST_CARGO_PROFILE=release uv pip install --system --exclude <(echo qiskit) -e .

      - name: Python tests
        shell: bash
        run: |
          make pystubs testpython

      - name: Optional tests
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release uv pip install --system --exclude <(echo qiskit) -e ".[all]"
          make testoptional

      - name: Documentation tests
        shell: bash
        run: |
          make doctest
