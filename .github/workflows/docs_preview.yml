---

# Publishes a pull request's rendered documentation to GitHub Pages, under `pr/<number>/`, when the
# pull request carries the `ci: preview docs` label.
#
# The label gates *publication* only.  The documentation is built for every pull request regardless, by
# `branch-protection.yml`, because a change that breaks the docs build should fail CI whether or not
# anyone wants to look at the result.
#
# Hence the `workflow_run` trigger: this workflow consumes the artifact that build already produced
# rather than building again, so adding the label costs a download instead of a fifteen-minute rebuild.
# It also means the label can be applied to an already-built pull request and the preview obtained by
# re-running this workflow, with no need to push a commit.
#
# Previews are restricted to branches in this repository.  A pull request from a fork gets no preview;
# its author can render the documentation locally with `make docs-local`.  That restriction is what
# keeps this workflow simple: everything it publishes was written by someone with write access, so
# there is no untrusted content on a run that holds a writable token.

name: Preview documentation

on:
  workflow_run:
    # Must match the `name:` of `branch-protection.yml` exactly.  There is no way to reference it
    # symbolically, and a rename there silently stops previews from ever being published, so the two
    # carry cross-referencing comments.
    workflows: ["Branch Protection"]
    types:
      - completed
  # Lets the publication be re-driven for a given pull request without pushing a commit, which is also
  # the only practical way to iterate on this workflow itself: `workflow_run` fires only from the
  # version of the file on the default branch.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull-request number to publish a preview for.
        required: true
        type: string

concurrency:
  # Repository-wide, and deliberately not per-pull-request: every publication pushes the same branch,
  # so they have to queue.  The retry loop in the publishing action copes with a race, but not racing in
  # the first place is cheaper.
  group: ${{ github.repository }}-gh-pages
  # Never cancel: a half-finished publication would leave a partially copied documentation tree behind.
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Check preview conditions
    # `workflow_run` fires for every completion of the upstream workflow, including on `main` and in the
    # merge queue.  Filter to successful pull-request builds of this repository before spending a runner
    # on it.
    if: >-
      github.repository_owner == 'Qiskit' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    runs-on: 'ubuntu-latest'
    permissions:
      pull-requests: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      pr: ${{ steps.check.outputs.pr }}
      run-id: ${{ steps.check.outputs.run-id }}
    steps:
      - name: Determine whether to publish
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # Populated for same-repo pull requests.  It is empty for forks, which is one of the reasons
          # forks are excluded rather than special-cased.
          PAYLOAD_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          DISPATCH_PR: ${{ inputs.pr }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          LABEL: 'ci: preview docs'
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            pr="$DISPATCH_PR"
            # A manual dispatch has no upstream run attached, so find the most recent successful
            # Branch Protection run for this pull request's head branch and take its artifact.
            if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
              echo "::error::'pr' input must be a number, got '$pr'" >&2
              exit 1
            fi
            head_sha=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            run_id=$(gh run list --repo "$REPO" --workflow 'Branch Protection' \
              --commit "$head_sha" --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty')
            if [[ -z "$run_id" ]]; then
              echo "::error::no successful Branch Protection run found for PR #$pr ($head_sha)" >&2
              exit 1
            fi
          else
            pr="$PAYLOAD_PR"
            run_id="$WORKFLOW_RUN_ID"

            # Belt and braces: the `pull_requests` array is empty for forks, so this is already implied.
            # Asserting it anyway keeps the restriction visible here rather than only in a comment, and
            # fails safe if the trigger is ever widened.
            if [[ "$HEAD_REPO" != "$REPO" ]]; then
              echo "Pull request originates from '$HEAD_REPO', not '$REPO'; skipping preview."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -z "$pr" ]]; then
              echo "No pull request attached to this run; skipping preview."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # The `workflow_run` payload carries no labels, so they have to be fetched.  This is also what
          # makes labelling an already-built pull request work.  Reading the state at the same time
          # avoids publishing a preview for a pull request that has been closed since the build, whose
          # preview the cleanup workflow has already removed.
          read -r state labelled < <(
            gh pr view "$pr" --repo "$REPO" --json state,labels \
              --jq '[.state, ([.labels[].name] | index($ENV.LABEL) != null)] | @tsv'
          ) || true
          if [[ -z "${state:-}" ]]; then
            echo "::error::could not read the state of pull request #$pr" >&2
            exit 1
          fi
          echo "Pull request #$pr is $state; labelled '$LABEL': $labelled"

          if [[ "$state" != "OPEN" ]]; then
            echo "Not publishing: the pull request is no longer open."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$labelled" != "true" ]]; then
            echo "Not publishing: add the '$LABEL' label to get a documentation preview."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish preview
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: 'ubuntu-latest'
    permissions:
      # Push the `gh-pages` branch.
      contents: write
      # Download an artifact from the run that built the documentation.
      actions: read
      # Comment the preview's location on the pull request.
      pull-requests: write
    steps:
      # The base repository, for the publishing action and the scripts it runs.  Deliberately not the
      # pull request's head: the artifact is the only thing taken from the pull request, and it is data
      # to be published rather than code to be run.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Publish to gh-pages
        uses: ./.github/actions/publish-docs
        with:
          artifact-run-id: ${{ needs.gate.outputs.run-id }}
          prefix: pr/${{ needs.gate.outputs.pr }}
          github-token: ${{ github.token }}

      - name: Comment the preview link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
          # Kept in step with `docs_preview_cleanup.yml`, which finds the comment by this marker.
          MARKER: '<!-- docs-preview -->'
        run: |
          set -euo pipefail
          url="https://qiskit.github.io/qiskit-fermions/pr/${PR}/"
          # Built with `printf` rather than a multi-line string: a quoted string would carry this
          # file's indentation into the comment, and four leading spaces make Markdown render the
          # whole thing as a code block instead of a link.
          body=$(printf '%s\n:book: [Documentation preview](%s) for this pull request.\n\n%s\n' \
            "$MARKER" "$url" \
            'Updated on every push while the `ci: preview docs` label is applied, and removed when this pull request is closed.')

          # Update in place rather than appending, so that a pull request accumulates one comment
          # instead of one per push.  Matching on the marker rather than on the author: an app posting
          # through a user account reports `type: User`, so the author is not a reliable discriminator.
          #
          # The numeric id and the GraphQL node id are different values, and both are needed below --
          # REST patches by the former, GraphQL mutates by the latter -- so read them together here
          # rather than looking the comment up twice.
          # `|| true` because `read` reports failure on empty input, which is the ordinary
          # first-push case rather than an error.
          read -r comment_id node_id < <(
            gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
              --jq "map(select(.body | startswith(\"${MARKER}\")))
                    | .[0] | [(.id // empty), (.node_id // empty)] | @tsv"
          ) || true

          if [[ -n "${comment_id:-}" ]]; then
            echo "Updating existing comment ${comment_id}."
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" \
              -f body="$body" --jq '.html_url'
            # The comment may have been collapsed by a previous close of this pull request, and a body
            # update alone would leave it hidden -- indistinguishable, to a reader, from no comment at
            # all.  Best-effort: this fails harmlessly when the comment is not currently minimized.
            gh api graphql -f query='
              mutation($id: ID!) {
                unminimizeComment(input: {subjectId: $id}) { clientMutationId }
              }' -F id="$node_id" >/dev/null 2>&1 || true
          else
            echo "Creating preview comment."
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
              -f body="$body" --jq '.html_url'
          fi
