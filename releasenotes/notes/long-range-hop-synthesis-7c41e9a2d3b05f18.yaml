---
fixes:
  - |
    :func:`~qiskit_fermions.transpiler.presets.generate_preset_jw_pass_manager` now lowers an
    :class:`~qiskit_fermions.circuit.library.OrbitalRotation` or a
    :class:`~qiskit_fermions.circuit.library.PrepareSlaterDeterminant` exactly when its modes are
    not contiguous or not in ascending order on the register. Previously, the result was slightly
    wrong for a rotation with complex entries: under Jordan-Wigner, a Givens factor between modes
    that are not adjacent on the register is a hop with a Z-string, which
    :class:`~qiskit_fermions.transpiler.passes.HopEvolutionSynthesis` declined and left to a product
    formula. The plugin now synthesizes the evolution under any hop with a Z-string exactly. The
    deprecated :class:`~qiskit_fermions.transpiler.passes.GivensDecompositionOrbitalRotationSynthesis`
    and :class:`~qiskit_fermions.transpiler.passes.GivensDecompositionSlaterDeterminantSynthesis`
    are fixed in the same way.
