---
fixes:
  - |
    Fixed :class:`.QDriftTrotterization` discarding the sign of each Hamiltonian
    coefficient. The pass previously replaced every sampled coefficient with
    ``1.0``, so terms with negative coefficients rotated in the wrong direction
    and the synthesized circuit did not converge to the target time evolution.
    Now only the coefficient *magnitude* (which sets the sampling probability) is
    dropped, while its sign is preserved. Coefficients whose magnitude is below
    ``1e-12`` (e.g. residual floating-point noise from an upstream integral
    transform) are treated as having a ``+1`` sign, consistent with their
    near-zero sampling probability.
