features:
  - |
    Added ``build_excitation_span_optimization_model``, a Pyomo-based utility
    that constructs a mixed-integer optimization model for ordering fermionic
    modes to reduce excitation spans. The model supports ``"minmax"``,
    ``"avg"``, and ``"multi"`` objectives over processed excitations.

    Added unit tests covering excitation preprocessing, variable and index-set
    construction, constraint creation, objective-dependent model components,
    and invalid-input handling.