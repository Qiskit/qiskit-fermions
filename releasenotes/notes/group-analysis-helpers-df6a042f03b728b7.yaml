---
upgrade:
  - |
    The ``group_weights`` method has been removed from every operator class and from the
    :class:`~qiskit_fermions.operators.OperatorTrait` protocol. It is replaced by
    :func:`~qiskit_fermions.operators.terms.grouping.group_coeff_means`, a free function in the
    :mod:`qiskit_fermions.operators.terms.grouping` module, whose behavior is unchanged::

        # before
        weights = op.group_weights()

        # after
        from qiskit_fermions.operators.terms.grouping import group_coeff_means

        weights = group_coeff_means(op)
  - |
    Assigning a :attr:`~qiskit_fermions.operators.FermionOperator.groups` array whose length differs
    from the operator's number of terms now raises a ``ValueError`` instead of being accepted
    silently. Assigning ``None`` to clear the group indices is unaffected.
upgrade_c:
  - |
    ``qf_ferm_op_group_weights`` and its per-type counterparts have been renamed to
    ``qf_ferm_op_group_coeff_means`` and friends. Their behavior is unchanged.
  - |
    ``qf_ferm_op_set_groups`` and its per-type counterparts now return a :c:enum:`QfExitCode` rather
    than ``void``. Passing a group array whose length differs from the operator's number of terms
    returns ``QfExitCode_ValueError`` instead of being accepted silently; passing ``NULL`` to clear
    the group indices is unaffected.
features:
  - |
    The :mod:`qiskit_fermions.operators.terms.grouping` module now covers the *analysis* of an
    existing grouping alongside the assignment of group indices. Group indices carry no intrinsic
    meaning, so none of the new functions reports whether a grouping is "correct"; each answers one
    narrow question about a grouping, so that an assumption a downstream consumer makes can be
    checked up front rather than being paid for on every call:

    * :func:`~qiskit_fermions.operators.terms.grouping.groups_are_hermitian` reports, for each
      group, whether the operator formed by its terms is Hermitian. This is the property a
      randomized product formula relies on when it samples whole groups, since only a Hermitian
      group has a unitary time evolution.
    * :func:`~qiskit_fermions.operators.terms.grouping.groups_have_uniform_coeffs` reports, for each
      group, whether its coefficients are numerically equal (by magnitude, by default).

    See :ref:`grouping_explanation` for a worked example.
features_c:
  - |
    Added ``qf_ferm_op_groups_are_hermitian`` and ``qf_ferm_op_groups_have_uniform_coeffs``, which
    report for each group whether the operator formed by its terms is Hermitian and whether its
    coefficients are numerically equal, along with the equivalent functions for the Majorana,
    edge-vertex and transfer-vertex operator types.
