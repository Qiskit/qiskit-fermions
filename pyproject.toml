[build-system]
# This is duplicated as `dependency-groups.build` for convenience.
requires = [
    "setuptools>=77.0.1",
    "setuptools-rust",
    "qiskit~=2.5.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-fermions"
dynamic = ["version"]
readme = "README.md"
description = "Qiskit for Fermions"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

requires-python = ">=3.10"

dependencies = [
    # Pinned to a single minor: `crates/qiskit-pyo3-ffi` is a pre-generated FFI snapshot tied to
    # this Qiskit release, and its stability across Qiskit minors is not yet guaranteed. Widen
    # this once a new minor has been verified against the vendored FFI.
    "qiskit~=2.5.0",
    "scipy>=1.10",
    "stevedore>=3.0.0",
    "typing-extensions",
]

# Rendered as the sidebar links on the PyPI project page.
[project.urls]
Homepage = "https://github.com/Qiskit/qiskit-fermions"
Documentation = "https://quantum.cloud.ibm.com/docs/addons/qiskit-fermions"
Repository = "https://github.com/Qiskit/qiskit-fermions"
Issues = "https://github.com/Qiskit/qiskit-fermions/issues"

[project.optional-dependencies]
all = [
    "qiskit-fermions[optimization,simulation]",
]
optimization = [
    "pyomo",
]
simulation = [
    # ffsim (and its unconditional PySCF dependency) does not support Windows, so restrict it to
    # non-Windows platforms; this is one reason the simulation backend is an optional dependency.
    "ffsim; sys_platform != 'win32'",
]

[dependency-groups]
build = [
    "setuptools>=77.0.1",
    "setuptools-rust",
    "qiskit~=2.5.0",
]
style = [
    "ruff==0.16.5",
    "typos>=1.20.0",
]
lint = [
    {include-group = "style"},
    "mypy==2.1.0",
    "reno>=4.1",
    "toml>=0.10.2",
]
basetest = [
    "pytest>=8.0",
    "pytest-subtests>=0.15.0",
]
doctest = [
    {include-group = "basetest"},
    "rustworkx[mpl]",
    "pylatexenc",
    "sybil>=9.3.0",
    # the LUCJ guide (docs/guides/lucj.rst) renders and evaluates a UCJ ansatz, which requires the
    # simulation backend (ffsim, which pulls in PySCF for the underlying quantum chemistry). Neither
    # supports Windows, so both are gated to non-Windows platforms and the guide's doctest is
    # skipped there (see docs/guides/lucj.rst).
    "ffsim; sys_platform != 'win32'",
    # the SKQD guide (docs/guides/skqd.rst) closes its final section by diagonalizing the sampled
    # subspace with qiskit-addon-sqd (configuration recovery). It pulls in PySCF and, like ffsim,
    # does not support Windows, so it is gated to non-Windows platforms and that step's doctest is
    # skipped there (see docs/guides/skqd.rst).
    "qiskit-addon-sqd; sys_platform != 'win32'",
]
test = [
    {include-group = "basetest"},
    {include-group = "doctest"},
    "highspy>=1.7.1",
]
coverage = [
    {include-group = "test"},
    "pytest-cov>=7.1.0",
]
docs = [
    {include-group = "doctest"},
    "qiskit-sphinx-theme~=2.1.0",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx_reredirects",
    "sphinxcontrib-katex",
    "nbsphinx>=0.9.4",
    "reno>=4.1",
    "breathe>=4.36.0",
]
dev = [
    {include-group = "docs"},
    {include-group = "lint"},
    {include-group = "coverage"},
    "tox>=4.28.0",
]

[project.entry-points."qiskit_fermions.transpiler.synthesis"]
"Evolution.MapperFn" = "qiskit_fermions.transpiler.passes.synthesis:MapperFnEvolutionSynthesis"
"InitializeModes.TrivialOccupation" = "qiskit_fermions.transpiler.passes.synthesis:TrivialOccupationInitializeModesSynthesis"
"OrbitalRotation.GivensDecomposition" = "qiskit_fermions.transpiler.passes.synthesis:GivensDecompositionOrbitalRotationSynthesis"
"PrepareSlaterDeterminant.GivensDecompositionSlater" = "qiskit_fermions.transpiler.passes.synthesis:GivensDecompositionSlaterDeterminantSynthesis"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "qiskit_fermions.version.__version__" }

[tool.setuptools.package-data]
# `py.typed` marks the package as typed (PEP 561); the `_lib/**/*.pyi` stubs are the
# pyo3-stub-gen output for the compiled extension and must ship in the wheel so the
# native API is typed for downstream consumers (the pure-Python API is typed inline).
qiskit_fermions = ["VERSION.txt", "py.typed", "_lib/**/*.pyi"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["qiskit_fermions", "qiskit_fermions.*"]

[tool.coverage.run]
branch = true
parallel = true
omit = [
    # `version.py` shells out to git and is exercised only during packaging, not by the test
    # suite; exclude the whole file rather than annotating every line with `# pragma: no cover`.
    "*/qiskit_fermions/version.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.10"
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["./python/qiskit_fermions/", "./tests/python/"]

[tool.ruff]
line-length = 100
src = ["python/qiskit_fermions", "tests/python"]
target-version = "py310"
# The `_lib/**/*.pyi` stubs are verbatim `pyo3-stub-gen` output (see tests/README.md, "Type
# stubs"); they are generated, never hand-edited, and follow the generator's own style rather than
# ours, so we exclude them from both `ruff format` and `ruff check`.
extend-exclude = ["python/qiskit_fermions/_lib"]

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "RUF", # ruff
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/python/**.py" = [
    "D",  # pydocstyle
]
"docs/**/*" = [
    "E402", # module level import not at top of file
    "D",    # pydocstyle
]
"python/qiskit_fermions/**/majorana_operator.py" = [
    "RUF002", # ambiguous unicode character in docstring: γ is a Majorana-operator symbol, not a typo
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.typos.default.extend-words]
arange = "arange"
ba = "ba"
iz = "iz"
ket = "ket"
thr = "thr"

[tool.typos.default.extend-identifiers]
# numpy's array type; `ND` trips the "should be AND" heuristic. Spelled out verbatim in the
# `occupation_axis_mask` stub-type override in crates/pyext (the generated `.pyi` are excluded).
NDArray = "NDArray"

[tool.typos.files]
extend-exclude = ["crates/qiskit-pyo3-ffi"]

# `pyext` is built abi3 (see `crates/pyext/Cargo.toml`'s `pyo3` feature `abi3-py310` and
# `setup.py`'s `py_limited_api="cp310"`), so cibuildwheel collapses each platform down to a
# single `cp310-abi3` wheel.
[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build = ["cp3??-*"]
skip = [
    "cp315-*",  # not yet supported
    "*-win32",
    "*_i686",
    "*_universal2",
    "*-musllinux_*",
]
# Run straight from the source checkout: passing an explicit path (`{project}/tests/python`) on
# the command line makes pytest ignore `[tool.pytest.ini_options].testpaths`, so it never walks
# into `python/qiskit_fermions/` and picks up the Sybil-collected doctests there (those need the
# `doctest` dependency group and stay owned by `test_latest_versions.yml`; here we only want the
# plain `tests/python` suite against the installed wheel). Deliberately narrower than the full
# `test` dependency group for the same reason: doctests aren't run here (`-p no:doctest`).
# Both the `--group` and the test path are qualified with `{project}` rather than relying on a
# `cd`, since cibuildwheel runs the test command from its own scratch directory (not the source
# checkout) and, on Windows, a `cd ... &&`-chained command does not reliably carry its directory
# change through to the rest of the chain.
test-command = "pip install --group {project}/pyproject.toml:basetest && python -m pytest -p no:doctest -s {project}/tests/python"
environment = 'RUSTUP_TOOLCHAIN="stable"'

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
environment = 'PATH="$PATH:$HOME/.cargo/bin" CARGO_NET_GIT_FETCH_WITH_CLI="true" RUSTUP_TOOLCHAIN="stable"'
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} && pipx run abi3audit --strict --report {wheel}"

[tool.cibuildwheel.macos]
# A single floor for both architectures: `rustc` raises it to 11.0 for `aarch64-apple-darwin` (the
# oldest macOS with arm64 support) on its own, so the arm64 wheels still come out tagged
# `macosx_11_0_arm64` while the x86_64 ones reach back to the older Intel machines that can still run
# them.  10.12 is also `rustc`'s own default for `x86_64-apple-darwin`.
environment = "MACOSX_DEPLOYMENT_TARGET='10.12' RUSTUP_TOOLCHAIN=stable"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} && pipx run abi3audit --strict --report {wheel}"

[tool.cibuildwheel.windows]
repair-wheel-command = "cp {wheel} {dest_dir}/. && pipx run abi3audit --strict --report {wheel}"
