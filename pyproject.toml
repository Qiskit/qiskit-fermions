[build-system]
# This is duplicated as `dependency-groups.build` for convenience.
requires = [
    "setuptools>=77.0.1",
    "setuptools-rust",
    "qiskit>=2.5",
]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-fermions"
dynamic = ["version"]
readme = "README.md"
description = "Qiskit for Fermions"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

requires-python = ">=3.10"

dependencies = [
    "qiskit>=2.5.0, <3",
    "stevedore>=3.0.0",
    "typing-extensions",
]

[project.optional-dependencies]
all = [
    "qiskit-fermions[optimization]",
]
optimization = [
    "pyomo",
]

[dependency-groups]
build = [
    "setuptools>=77.0.1",
    "setuptools-rust",
    "qiskit>=2.5",
]
style = [
    "ruff==0.15.8",
    "typos>=1.20.0",
]
lint = [
    {include-group = "style"},
    "mypy==2.1.0",
    "reno>=4.1",
    "toml>=0.10.2",
]
basetest = [
    "pytest>=8.0",
    "pytest-subtests>=0.15.0",
]
doctest = [
    {include-group = "basetest"},
    "rustworkx[mpl]",
    "pylatexenc",
    "sybil>=9.3.0",
]
test = [
    {include-group = "basetest"},
    {include-group = "doctest"},
    "highspy>=1.7.1",
]
coverage = [
    {include-group = "test"},
    "pytest-cov>=7.1.0",
]
docs = [
    {include-group = "doctest"},
    "qiskit-sphinx-theme~=2.1.0",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx_reredirects",
    "sphinxcontrib-katex",
    "nbsphinx>=0.9.4",
    "reno>=4.1",
    "breathe>=4.36.0",
]
dev = [
    {include-group = "docs"},
    {include-group = "lint"},
    {include-group = "coverage"},
    "tox>=4.28.0",
]

[project.entry-points."qiskit_fermions.transpiler.synthesis"]
"Evolution.MapperFn" = "qiskit_fermions.transpiler.passes.synthesis:MapperFnEvolutionSynthesis"
"InitializeModes.TrivialOccupation" = "qiskit_fermions.transpiler.passes.synthesis:TrivialOccupationInitializeModesSynthesis"
"OrbitalRotation.GivensDecomposition" = "qiskit_fermions.transpiler.passes.synthesis:GivensDecompositionOrbitalRotationSynthesis"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "qiskit_fermions.version.__version__" }

[tool.setuptools.package-data]
# `py.typed` marks the package as typed (PEP 561); the `_lib/**/*.pyi` stubs are the
# pyo3-stub-gen output for the compiled extension and must ship in the wheel so the
# native API is typed for downstream consumers (the pure-Python API is typed inline).
qiskit_fermions = ["VERSION.txt", "py.typed", "_lib/**/*.pyi"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["qiskit_fermions", "qiskit_fermions.*"]

[tool.coverage.run]
branch = true
parallel = true
omit = [
    # `version.py` shells out to git and is exercised only during packaging, not by the test
    # suite; exclude the whole file rather than annotating every line with `# pragma: no cover`.
    "*/qiskit_fermions/version.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.10"
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["./python/qiskit_fermions/", "./tests/python/"]

[tool.ruff]
line-length = 100
src = ["python/qiskit_fermions", "tests/python"]
target-version = "py310"
# The `_lib/**/*.pyi` stubs are verbatim `pyo3-stub-gen` output (see tests/README.md, "Type
# stubs"); they are generated, never hand-edited, and follow the generator's own style rather than
# ours, so we exclude them from both `ruff format` and `ruff check`.
extend-exclude = ["python/qiskit_fermions/_lib"]

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "RUF", # ruff
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/python/**.py" = [
    "D",  # pydocstyle
]
"docs/**/*" = [
    "E402", # module level import not at top of file
    "D",    # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.typos.default.extend-words]
arange = "arange"
ba = "ba"
thr = "thr"
iz = "iz"

[tool.typos.files]
extend-exclude = ["crates/qiskit-pyo3-ffi"]
