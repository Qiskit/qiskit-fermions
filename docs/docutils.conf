# Sphinx reads this file from the configuration directory and applies it on top
# of its own docutils defaults.

[general]
# Do not render the "(1,2,3,...)" list of links back to every citation site next
# to a footnote. A guide citing one reference many times otherwise gets a long
# run of bare numbers above the reference, which reads especially oddly once the
# page is ingested into IQP.
footnote_backlinks: no
